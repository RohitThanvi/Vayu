name: Keep Render backend awake

on:
  schedule:
    - cron: "*/8 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -sS -o /dev/null -w "status=%{http_code} time=%{time_total}s\n" \
            --max-time 30 --retry 2 --retry-delay 5 \
            "https://vayu-0zxv.onrender.com/health"