server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The service worker and the offline page must never be cached long: browsers re-check sw.js to pick up updates.
    location = /sw.js { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options "nosniff" always; try_files $uri =404; }
    location = /offline.html { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options "nosniff" always; add_header X-Frame-Options "DENY" always; try_files $uri =404; }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
