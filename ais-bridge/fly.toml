# Fly.io config for the Vayu network bridge (AIS + OpenSky).
# Deploy with: fly launch --no-deploy   (first time, from inside ais-bridge/)
#              fly secrets set AISSTREAM_API_KEY=... OPENSKY_CLIENT_ID=... OPENSKY_CLIENT_SECRET=... BRIDGE_API_KEY=...
#              fly deploy
app = "vayu-ais-bridge"     # change if this name is taken
primary_region = "sin"      # Singapore — close to India; pick whatever's closest to you

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # keep the AISStream connection alive continuously
  auto_start_machines = true
  min_machines_running = 1     # a stream buffer that scales to zero loses all its data

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
